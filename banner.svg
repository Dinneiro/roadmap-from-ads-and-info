<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300px">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      
      .bg { fill: #0a0a0f; }
      .binary { 
        font-family: monospace; 
        font-size: 14px; 
        fill: #00ff41; 
        writing-mode: vertical-rl; 
        text-orientation: upright;
        opacity: 0.8;
      }
      .title { 
        font-family: 'Press Start 2P', monospace; 
        font-size: 28px; 
        fill: #ffffff; 
        text-anchor: middle;
        text-shadow: 4px 4px 0px #041635, -2px -2px 0px #38bdf8;
      }
      .subtitle { 
        font-family: 'Press Start 2P', monospace; 
        font-size: 12px; 
        fill: #7dd3fc; 
        text-anchor: middle; 
      }
      .box {
        fill: rgba(4, 22, 53, 0.85);
        stroke: #38bdf8;
        stroke-width: 4;
        stroke-dasharray: 10 5;
      }
    </style>
  </defs>

  <!-- Fundo escuro -->
  <rect class="bg" width="100%" height="100%" rx="10"/>

  <!-- Efeito de Matrix (Binários caindo) -->
  <g class="binary">
    <!-- Coluna 1 -->
    <g transform="translate(40, -300)">
      <animateTransform attributeName="transform" type="translate" from="0 -300" to="0 300" dur="4s" repeatCount="indefinite" />
      <text y="0">010010110101</text>
    </g>
    <!-- Coluna 2 -->
    <g transform="translate(120, -100)">
      <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 300" dur="6s" repeatCount="indefinite" />
      <text y="0">1011001001111</text>
    </g>
    <!-- Coluna 3 -->
    <g transform="translate(220, -400)">
      <animateTransform attributeName="transform" type="translate" from="0 -400" to="0 300" dur="5s" repeatCount="indefinite" />
      <text y="0">0010111010</text>
    </g>
    <!-- Coluna 4 -->
    <g transform="translate(320, -200)">
      <animateTransform attributeName="transform" type="translate" from="0 -200" to="0 300" dur="7s" repeatCount="indefinite" />
      <text y="0">1110010101</text>
    </g>
    <!-- Coluna 5 -->
    <g transform="translate(450, -500)">
      <animateTransform attributeName="transform" type="translate" from="0 -500" to="0 300" dur="4.5s" repeatCount="indefinite" />
      <text y="0">10001110100</text>
    </g>
    <!-- Coluna 6 -->
    <g transform="translate(580, -150)">
      <animateTransform attributeName="transform" type="translate" from="0 -150" to="0 300" dur="5.5s" repeatCount="indefinite" />
      <text y="0">1101001101</text>
    </g>
    <!-- Coluna 7 -->
    <g transform="translate(680, -350)">
      <animateTransform attributeName="transform" type="translate" from="0 -350" to="0 300" dur="6.5s" repeatCount="indefinite" />
      <text y="0">1010101110</text>
    </g>
    <!-- Coluna 8 -->
    <g transform="translate(760, -250)">
      <animateTransform attributeName="transform" type="translate" from="0 -250" to="0 300" dur="4.2s" repeatCount="indefinite" />
      <text y="0">0101010111</text>
    </g>
  </g>

  <!-- Caixa de Texto Central (Estilo Jogo) -->
  <g>
    <!-- Animação de Flutuação -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite" />
    <rect x="120" y="90" width="560" height="120" class="box" rx="5" />
    <text x="400" y="145" class="title">ROADMAP DE ESTUDOS</text>
    <text x="400" y="180" class="subtitle">&gt;_ TÉCNICO EM INFORMÁTICA TO ADS</text>
  </g>
</svg>
<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="roundedBanner">
      <rect x="0" y="0" width="1200" height="260" rx="18" ry="18" />
    </clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <image href="https://i.pinimg.com/736x/d6/01/df/d601dfb04b69604a8f3c90c60d61ad1b.jpg"
           x="0" y="0" width="1200" height="260"
           preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1200" height="260" fill="url(#overlay)" />
  </g>

  <text x="600" y="150" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700"
        fill="#ffffff" stroke="#000000" stroke-width="1" letter-spacing="2">
    Estudos
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite" />
  </text>

  <rect x="0" y="0" width="1200" height="260" rx="18" ry="18"
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
</svg>
