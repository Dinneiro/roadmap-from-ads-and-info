<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="roundedBanner">
      <rect x="0" y="0" width="1200" height="260" rx="18" ry="18" />
    </clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedBanner)">
    <image href="https://i.pinimg.com/736x/d6/01/df/d601dfb04b69604a8f3c90c60d61ad1b.jpg"
           x="0" y="0" width="1200" height="260"
           preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="1200" height="260" fill="url(#overlay)" />
  </g>

  <text x="600" y="150" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700"
        fill="#ffffff" stroke="#000000" stroke-width="1" letter-spacing="2">
    Estudos
    <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite" />
  </text>

  <rect x="0" y="0" width="1200" height="260" rx="18" ry="18"
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
</svg>
