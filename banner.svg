<svg width="894" height="354" viewBox="0 0 894 354" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01040f" />
      <stop offset="55%" stop-color="#041635" />
      <stop offset="100%" stop-color="#0a2f66" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="894" height="354" fill="url(#bg)" />
  <rect width="894" height="354" fill="url(#grid)" />

  <!-- scanline sutil -->
  <g stroke="#38bdf8" stroke-opacity="0.12">
    <line x1="0" y1="30" x2="894" y2="30" />
    <line x1="0" y1="324" x2="894" y2="324" />
  </g>

  <!-- coluna estilo matrix à esquerda -->
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#22c55e" opacity="0.55">
    <text x="18" y="24">0xA9</text>
    <text x="18" y="42">if(ok)</text>
    <text x="18" y="60">{</text>
    <text x="18" y="78">run();</text>
    <text x="18" y="96">}</text>
    <text x="18" y="114">1</text>
    <text x="18" y="132">0</text>
    <text x="18" y="150">while</text>
    <text x="18" y="168">(true)</text>
    <text x="18" y="186">{</text>
    <text x="18" y="204">study</text>
    <text x="18" y="222">++;</text>
    <text x="18" y="240">}</text>
    <text x="18" y="258">log</text>
    <text x="18" y="276">(done)</text>
    <text x="18" y="294">0xFF</text>
    <text x="18" y="312">EOF</text>
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3.2s" repeatCount="indefinite" />
  </g>
  <line x1="40" y1="0" x2="40" y2="354" stroke="#22c55e" stroke-opacity="0.25" stroke-width="1" />

  <!-- glow atrás da caixa -->
  <rect x="195" y="130" width="530" height="85" rx="40"
        fill="#38bdf8" fill-opacity="0.22" filter="url(#bigBlur)" />

  <!-- ícones decorativos -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5">
    <circle cx="820" cy="48" r="13" />
    <path d="M814,48 l4,4 l8,-8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.45">
    <path d="M110,318 l12,-12 l-12,-12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M132,318 l12,-12 l-12,-12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- caixa tracejada com "formigas andando" -->
  <rect x="165" y="105" width="590" height="135" rx="6"
        fill="#071d42" fill-opacity="0.75"
        stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10 7"
        filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="34" dur="2.5s" repeatCount="indefinite" />
  </rect>

  <!-- título -->
  <text x="460" y="168" text-anchor="middle"
        font-family="Consolas, 'Segoe UI', monospace" font-weight="800" font-size="30"
        fill="url(#titleGrad)" letter-spacing="2" filter="url(#softGlow)">
    ROADMAP DE ESTUDOS
  </text>

  <!-- subtítulo com cursor piscando -->
  <text x="460" y="202" text-anchor="middle"
        font-family="Consolas, monospace" font-size="13.5" fill="#7dd3fc" letter-spacing="1">
    &gt;_ TÉCNICO EM INFORMÁTICA <tspan fill="#38bdf8">&#8594;</tspan> ADS
    <tspan fill="#bae6fd">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </tspan>
  </text>

  <!-- cursor de terminal piscando -->
  <rect x="628" y="190" width="9" height="14" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
  </rect>

  <!-- linha de status inferior -->
  <text x="460" y="322" text-anchor="middle"
        font-family="Consolas, monospace" font-size="10.5" fill="#38bdf8" opacity="0.65">
    cursos públicos BR · gratuitos · com certificado
  </text>
</svg>
